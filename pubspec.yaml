name: taddabur
description: "Islamic knowledge and transformation app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0

  # Backend
  supabase_flutter: ^2.17.2

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # Local storage
  sqflite: ^2.3.2
  path: ^1.9.0

  # Fonts
  google_fonts: ^6.2.1

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Internationalisation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

