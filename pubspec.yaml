name: mizan
description: "Islamic knowledge and transformation app"
publish_to: 'none'
# 1.0.0 because that is what the release tag, the APK filename and the site all
# say. +1 is the Android versionCode: it must increase on every build you ship,
# even a re-upload of the same 1.0.0 — Android refuses to install a build whose
# versionCode is not higher than the one already on the device.
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State management
  flutter_riverpod: ^2.5.0
  shared_preferences: ^2.3.2

  # Backend
  supabase_flutter: ^2.17.2

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # Local storage
  sqflite: ^2.3.2
  path: ^1.9.0

  # Crypto (local account password hashing)
  crypto: ^3.0.6

  # Fonts
  google_fonts: ^6.2.1

  # No dotenv. Configuration arrives as compile-time --dart-define constants
  # instead — see lib/core/config/build_config.dart. flutter_dotenv reads `.env`
  # through the asset bundle, which requires `.env` to be declared as an asset,
  # which puts a plaintext copy of every key inside the APK. Removing the package
  # is what makes that impossible rather than merely discouraged.

  # Internationalisation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  just_audio: ^0.10.6
  # Declared directly, not left transitive: just_audio requires the audio session
  # to be configured explicitly (iOS routes to the ambient stream otherwise, and
  # Android never requests audio focus). Already resolved at 0.2.4 via just_audio,
  # so this adds no new package to fetch.
  audio_session: ^0.2.4
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    # `.env` is deliberately NOT listed here, and must never be added back.
    # Anything in this list is a file inside the build: `unzip -p app.apk
    # assets/flutter_assets/.env` would print every key in it, and a web build
    # would serve it at `/assets/.env`. Configuration comes in through
    # --dart-define instead; see lib/core/config/build_config.dart and
    # tools/build_release.sh.

    # Icons and logo — see assets/README.md, which is the spec these follow.
    #
    # The density folders are a Flutter convention: the framework resolves 2.0x
    # and 3.0x from the device pixel ratio, so code only ever names the 1x path.
    # `dark/` is the second colourway, not a second set — same ten filenames, and
    # only that one path segment changes on a theme switch.
    #
    # `assets/icons/master/` is deliberately absent. Those are the ~300px
    # originals; shipping them would put four unreachable copies of every icon in
    # the APK.
    - assets/icons/
    - assets/icons/2.0x/
    - assets/icons/3.0x/
    - assets/icons/dark/
    - assets/icons/dark/2.0x/
    - assets/icons/dark/3.0x/
    - assets/logo/
    - assets/logo/square/

    - assets/data/ibn_kathir/
    - assets/data/ibn_kathir_processed/
    - assets/data/discover/prophets/
    - assets/data/discover/sahabah/
    - assets/data/discover/names/
    - assets/data/discover/seerah/
    - assets/data/knowledge/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    # The family names here are what MizanType passes as `fontFamily`, so they
    # must stay spelled exactly as they are in mizan_typography.dart. Bundled
    # rather than fetched at runtime: google_fonts downloads on first use, so a
    # first launch with no network fell back to Roboto and the whole app looked
    # like a different product.
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

